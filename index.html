<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebODM Deck.GL Map</title>
    
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Deck.GL (Standalone UMD) -->
    <script src="https://unpkg.com/deck.gl@8.9.33/dist.min.js"></script>

    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #000; }
        
        /* Fullscreen Map */
        #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; }
        
        /* Floating UI Elements */
        #layer-panel {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 360px;
            max-height: calc(100vh - 100px);
            z-index: 10;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        
        #layer-panel.open {
            transform: translateX(0);
        }

        #fab-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 20;
        }

        /* Custom Scrollbar for Panel */
        .scrollable-content::-webkit-scrollbar { width: 6px; }
        .scrollable-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        .scrollable-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        .scrollable-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body class="text-white">

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Floating Panel for Data & Layers -->
    <div id="layer-panel" class="bg-gray-900/95 backdrop-blur-lg shadow-2xl rounded-xl border border-gray-700 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gray-800 px-4 py-3 border-b border-gray-700 flex justify-between items-center">
            <h2 class="font-bold text-gray-100 flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                Data Manager
            </h2>
            <button id="btn-close-panel" class="text-gray-400 hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="scrollable-content overflow-y-auto p-4 flex flex-col gap-5 flex-grow">
            
            <!-- Connection Form -->
            <form id="auth-form" class="flex flex-col gap-3">
                <p class="text-xs text-gray-400 mb-2">Connect to your WebODM instance to load layers.</p>
                <div>
                    <label class="text-xs text-gray-400 font-semibold uppercase">Server URL</label>
                    <input type="text" id="server-url" value="http://localhost:8000" required class="w-full mt-1 bg-black/50 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="text-xs text-gray-400 font-semibold uppercase">Username</label>
                    <input type="text" id="username" value="admin" required class="w-full mt-1 bg-black/50 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="text-xs text-gray-400 font-semibold uppercase">Password</label>
                    <input type="password" id="password" required class="w-full mt-1 bg-black/50 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-blue-500 transition">
                </div>
                <button type="submit" id="btn-connect" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded transition mt-2">
                    Connect
                </button>
                <div id="auth-error" class="text-red-300 text-xs hidden bg-red-900/40 p-2 rounded border border-red-800"></div>
            </form>

            <!-- Data Selection & Layers (Hidden Initially) -->
            <div id="data-section" class="hidden flex-col gap-5">
                
                <!-- Status Bar -->
                <div class="flex justify-between items-center bg-black/30 p-2 rounded border border-gray-700/50">
                    <span class="text-xs font-semibold text-green-400 flex items-center gap-1.5">
                        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div> Connected
                    </span>
                    <button id="btn-logout" class="text-xs text-gray-400 hover:text-white underline">Disconnect</button>
                </div>

                <!-- Selectors -->
                <div class="flex flex-col gap-3">
                    <div>
                        <label class="text-xs text-gray-400 font-semibold uppercase">Project</label>
                        <select id="project-select" class="w-full mt-1 bg-black/50 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-blue-500">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 font-semibold uppercase">Task</label>
                        <select id="task-select" class="w-full mt-1 bg-black/50 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-blue-500" disabled>
                            <option value="">Select project first</option>
                        </select>
                    </div>
                </div>

                <!-- Layer Toggles -->
                <div id="layer-controls" class="hidden flex-col gap-4 pt-4 border-t border-gray-700">
                    
                    <!-- Raster Layers -->
                    <div>
                        <h3 class="text-xs text-gray-400 font-semibold uppercase mb-2 flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            2D Raster Layers
                        </h3>
                        <div class="grid grid-cols-1 gap-2">
                            <label class="flex items-center space-x-3 bg-black/30 p-2 rounded border border-gray-700/50 cursor-pointer hover:bg-black/50 transition">
                                <input type="checkbox" class="layer-toggle w-4 h-4 text-blue-600 rounded border-gray-600 bg-gray-700" value="orthophoto" checked>
                                <span class="text-sm font-medium">Orthophoto</span>
                            </label>
                            <label class="flex items-center space-x-3 bg-black/30 p-2 rounded border border-gray-700/50 cursor-pointer hover:bg-black/50 transition">
                                <input type="checkbox" class="layer-toggle w-4 h-4 text-blue-600 rounded border-gray-600 bg-gray-700" value="dsm">
                                <span class="text-sm font-medium">DSM (Surface Model)</span>
                            </label>
                            <label class="flex items-center space-x-3 bg-black/30 p-2 rounded border border-gray-700/50 cursor-pointer hover:bg-black/50 transition">
                                <input type="checkbox" class="layer-toggle w-4 h-4 text-blue-600 rounded border-gray-600 bg-gray-700" value="dtm">
                                <span class="text-sm font-medium">DTM (Terrain Model)</span>
                            </label>
                        </div>
                    </div>

                    <!-- 3D / Vector Extensibility Stubs -->
                    <div class="opacity-50">
                        <h3 class="text-xs text-gray-400 font-semibold uppercase mb-2 flex items-center gap-1">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
                            3D / Vector (Coming Soon)
                        </h3>
                        <div class="grid grid-cols-1 gap-2">
                            <label class="flex items-center space-x-3 bg-black/30 p-2 rounded border border-gray-700/50 cursor-not-allowed">
                                <input type="checkbox" disabled class="w-4 h-4 rounded border-gray-600 bg-gray-800">
                                <span class="text-sm font-medium text-gray-500">Point Cloud (LAZ/Potree)</span>
                            </label>
                            <label class="flex items-center space-x-3 bg-black/30 p-2 rounded border border-gray-700/50 cursor-not-allowed">
                                <input type="checkbox" disabled class="w-4 h-4 rounded border-gray-600 bg-gray-800">
                                <span class="text-sm font-medium text-gray-500">3D Model (OBJ)</span>
                            </label>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Floating Action Button (FAB) -->
    <button id="fab-btn" class="w-14 h-14 bg-blue-600 hover:bg-blue-500 text-white rounded-full shadow-[0_0_20px_rgba(37,99,235,0.4)] flex items-center justify-center transition-transform hover:scale-105 active:scale-95">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>

    <script>
        // --- 1. State Management & DOM Elements ---
        const state = {
            url: '',
            token: null,
            projects: [],
            tasks: [],
            activeProject: null,
            activeTask: null,
            activeLayers: new Set(['orthophoto'])
        };

        const panel = document.getElementById('layer-panel');
        const fabBtn = document.getElementById('fab-btn');
        const btnClosePanel = document.getElementById('btn-close-panel');
        const uiAuthForm = document.getElementById('auth-form');
        const uiData = document.getElementById('data-section');
        const uiError = document.getElementById('auth-error');
        const btnConnect = document.getElementById('btn-connect');
        const btnLogout = document.getElementById('btn-logout');
        const selectProject = document.getElementById('project-select');
        const selectTask = document.getElementById('task-select');
        const layerControls = document.getElementById('layer-controls');
        const layerToggles = document.querySelectorAll('.layer-toggle');

        // --- 2. Register UI Interactions FIRST (Ensures UI works even if map crashes) ---
        fabBtn.addEventListener('click', () => panel.classList.add('open'));
        btnClosePanel.addEventListener('click', () => panel.classList.remove('open'));

        layerToggles.forEach(toggle => {
            toggle.addEventListener('change', (e) => {
                if(e.target.checked) state.activeLayers.add(e.target.value);
                else state.activeLayers.delete(e.target.value);
                updateDeckLayers();
            });
        });

        // --- 3. Map Initialization (Sandboxed to prevent crashes) ---
        let map, deckOverlay;
        
        try {
            map = new maplibregl.Map({
                container: 'map',
                style: {
                    version: 8,
                    sources: {
                        // Google tiles lack CORS headers and will crash MapLibre WebGL contexts. 
                        // Esri World Imagery is the industry standard CORS-friendly alternative.
                        'esri-satellite': {
                            type: 'raster',
                            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], 
                            tileSize: 256,
                            attribution: 'Map data © Esri'
                        },
                        'esri-reference': {
                            type: 'raster',
                            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'], 
                            tileSize: 256
                        }
                    },
                    layers: [
                        {
                            id: 'esri-satellite-layer',
                            type: 'raster',
                            source: 'esri-satellite',
                            minzoom: 0,
                            maxzoom: 22
                        },
                        {
                            id: 'esri-reference-layer',
                            type: 'raster',
                            source: 'esri-reference',
                            minzoom: 0,
                            maxzoom: 22
                        }
                    ]
                },
                center: [-98.5795, 39.8283], // Center US initially
                zoom: 3,
                pitch: 0
            });

            // Add Deck.GL Overlay Control to MapLibre
            deckOverlay = new deck.MapboxOverlay({
                interleaved: false,
                layers: []
            });
            map.addControl(deckOverlay);

            // Add Navigation UI
            map.addControl(new maplibregl.NavigationControl(), 'top-left');
            
        } catch (error) {
            console.error("CRITICAL ERROR: Failed to initialize map engine.", error);
            uiError.innerText = "The map engine failed to load. Check your browser console.";
            uiError.classList.remove('hidden');
        }

        // --- 4. API & Auth Logic ---
        async function apiCall(endpoint, method = 'GET', body = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (state.token) headers['Authorization'] = `JWT ${state.token}`;
            
            const config = { method, headers };
            if (body) config.body = JSON.stringify(body);

            try {
                const res = await fetch(`${state.url}${endpoint}`, config);
                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(`[${res.status}] API Error`);
                }
                return await res.json();
            } catch (err) {
                console.error("[API Failure]", err);
                throw err;
            }
        }

        uiAuthForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            let rawUrl = document.getElementById('server-url').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (rawUrl && !/^https?:\/\//i.test(rawUrl)) rawUrl = 'http://' + rawUrl;
            rawUrl = rawUrl.replace(/\/$/, '');

            btnConnect.innerText = "Connecting...";
            uiError.classList.add('hidden');

            try {
                state.url = rawUrl;
                const data = await apiCall('/api/token-auth/', 'POST', { username, password });
                
                if (data.token) {
                    state.token = data.token;
                    uiAuthForm.classList.add('hidden');
                    uiData.classList.remove('hidden');
                    uiData.classList.add('flex');
                    await loadProjects();
                } else {
                    throw new Error("No authorization token received.");
                }
            } catch (err) {
                uiError.innerText = `Connection Failed. Ensure CORS is enabled on WebODM.`;
                uiError.classList.remove('hidden');
            } finally {
                btnConnect.innerText = "Connect";
            }
        });

        btnLogout.addEventListener('click', () => {
            state.token = null;
            state.activeTask = null;
            uiAuthForm.classList.remove('hidden');
            uiData.classList.add('hidden');
            uiData.classList.remove('flex');
            updateDeckLayers();
        });

        async function loadProjects() {
            selectProject.innerHTML = '<option value="">Loading...</option>';
            try {
                const res = await apiCall('/api/projects/');
                state.projects = res.results || res; 
                selectProject.innerHTML = '<option value="">-- Choose a Project --</option>';
                state.projects.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.name;
                    selectProject.appendChild(opt);
                });
            } catch(e) {
                selectProject.innerHTML = '<option value="">Error loading projects</option>';
            }
        }

        selectProject.addEventListener('change', async (e) => {
            const projectId = e.target.value;
            if (!projectId) {
                selectTask.disabled = true;
                return;
            }
            state.activeProject = projectId;
            selectTask.innerHTML = '<option value="">Loading...</option>';
            selectTask.disabled = true;
            try {
                const res = await apiCall(`/api/projects/${projectId}/tasks/`);
                state.tasks = res.results || res;
                selectTask.innerHTML = '<option value="">-- Choose a Task --</option>';
                state.tasks.forEach(t => {
                    if(t.status === 40 || t.status === 50) { // Completed or Partial
                        const opt = document.createElement('option');
                        opt.value = t.id;
                        opt.textContent = t.name;
                        selectTask.appendChild(opt);
                    }
                });
                selectTask.disabled = false;
            } catch(e) {
                selectTask.innerHTML = '<option value="">Error loading tasks</option>';
            }
        });

        selectTask.addEventListener('change', async (e) => {
            const taskId = e.target.value;
            if (!taskId) {
                layerControls.classList.add('hidden');
                state.activeTask = null;
                updateDeckLayers();
                return;
            }
            
            state.activeTask = state.tasks.find(t => t.id == taskId);
            layerControls.classList.remove('hidden');
            layerControls.classList.add('flex');
            
            await flyToTaskExtent(state.activeProject, state.activeTask);
            updateDeckLayers();
            
            if(window.innerWidth < 768) {
                panel.classList.remove('open');
            }
        });

        // --- 5. Core Logic: Bounds & Rendering ---
        async function flyToTaskExtent(pid, task) {
            if (!map) return;
            try {
                const extentData = task.orthophoto_extent || task.dsm_extent || task.dtm_extent;
                if (extentData) {
                    const geojson = typeof extentData === 'string' ? JSON.parse(extentData) : extentData;
                    if (geojson && geojson.coordinates && geojson.coordinates[0]) {
                        
                        let minLng = 180, maxLng = -180, minLat = 90, maxLat = -90;
                        const coords = geojson.coordinates[0];
                        
                        coords.forEach(([lng, lat]) => {
                            if(lng < minLng) minLng = lng;
                            if(lng > maxLng) maxLng = lng;
                            if(lat < minLat) minLat = lat;
                            if(lat > maxLat) maxLat = lat;
                        });

                        map.fitBounds([[minLng, minLat], [maxLng, maxLat]], { padding: 80, duration: 2000 });
                        return;
                    }
                }
                console.warn("No extent found on task. Cannot automatically zoom.");
            } catch (e) {
                console.error("Failed to parse task extent or fly to bounds", e);
            }
        }

        function updateDeckLayers() {
            if (!deckOverlay) return;

            if (!state.activeTask || state.activeLayers.size === 0) {
                deckOverlay.setProps({ layers: [] });
                return;
            }

            const pid = state.activeProject;
            const tid = state.activeTask.id;
            const generatedLayers = [];
            const TILE_EXT = 'png';

            state.activeLayers.forEach(type => {
                const tileUrl = `${state.url}/api/projects/${pid}/tasks/${tid}/${type}/tiles/{z}/{x}/{y}.${TILE_EXT}`;
                
                const webodmLayer = new deck.TileLayer({
                    id: `webodm-${type}-${tid}`,
                    data: tileUrl,
                    minZoom: 0,
                    maxZoom: 22,
                    tileSize: 256,
                    
                    getTileData: async (tile) => {
                        try {
                            const response = await fetch(tile.url, {
                                headers: { 'Authorization': `JWT ${state.token}` }
                            });
                            if (!response.ok) return null; 
                            const blob = await response.blob();
                            return createImageBitmap(blob);
                        } catch (e) {
                            return null; 
                        }
                    },
                    
                    renderSubLayers: props => {
                        const { bbox: {west, south, east, north} } = props.tile;
                        return new deck.BitmapLayer(props, {
                            data: null,
                            image: props.data,
                            bounds: [west, south, east, north]
                        });
                    }
                });
                
                generatedLayers.push(webodmLayer);
            });

            deckOverlay.setProps({ layers: generatedLayers });
        }
    </script>
</body>
</html>
