<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebODM Map Explorer</title>
    
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Deck.GL (Standalone UMD) -->
    <script src="https://unpkg.com/deck.gl@8.9.33/dist.min.js"></script>

    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; color: #fff; font-family: system-ui, sans-serif; }
        
        /* The Map container fills the screen */
        #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* UI overlays must sit above the map */
        .z-ui { z-index: 50; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body>

    <!-- WebGL Map Container -->
    <div id="map"></div>

    <!-- UI Overlay Wrapper (pointer-events-none lets you drag map through the empty space) -->
    <div class="absolute inset-0 pointer-events-none z-ui p-4 md:p-6 flex flex-col items-end justify-end">
        
        <!-- Floating Layer Panel -->
        <!-- Starts hidden. pointer-events-auto makes it clickable -->
        <div id="layer-panel" class="hidden pointer-events-auto bg-gray-900/95 backdrop-blur-md border border-gray-700 shadow-2xl rounded-xl w-full max-w-sm max-h-[75vh] flex-col overflow-hidden mb-4 transition-all">
            
            <!-- Panel Header -->
            <div class="bg-gray-800 p-4 flex justify-between items-center border-b border-gray-700">
                <span class="font-bold text-gray-100 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                    Data Manager
                </span>
                <button id="btn-close-panel" class="text-gray-400 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <!-- Panel Body -->
            <div class="p-5 custom-scrollbar overflow-y-auto flex-1 flex flex-col gap-5 text-sm">
                
                <!-- Authentication State -->
                <form id="auth-form" class="flex flex-col gap-3">
                    <p class="text-xs text-gray-400 mb-1">Connect to WebODM to load data.</p>
                    <input id="server-url" type="url" value="http://localhost:8000" required class="bg-black/50 border border-gray-700 focus:border-blue-500 outline-none p-2 rounded w-full transition" placeholder="Server URL">
                    <input id="username" type="text" value="admin" required class="bg-black/50 border border-gray-700 focus:border-blue-500 outline-none p-2 rounded w-full transition" placeholder="Username">
                    <input id="password" type="password" required class="bg-black/50 border border-gray-700 focus:border-blue-500 outline-none p-2 rounded w-full transition" placeholder="Password">
                    <button type="submit" id="btn-connect" class="bg-blue-600 hover:bg-blue-500 py-2 rounded font-semibold transition mt-2">Connect</button>
                    <div id="auth-error" class="hidden text-red-300 bg-red-900/40 p-3 rounded text-xs border border-red-800 break-words"></div>
                </form>

                <!-- Data & Layers State -->
                <div id="data-section" class="hidden flex-col gap-4">
                    <div class="flex justify-between items-center text-xs text-gray-400 bg-black/30 p-2 rounded border border-gray-700/50">
                        <span class="text-green-400 font-semibold flex items-center gap-1.5">
                            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Connected
                        </span>
                        <button id="btn-logout" class="hover:text-white underline">Disconnect</button>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-gray-400 font-bold uppercase">Project</label>
                        <select id="project-select" class="bg-black/50 border border-gray-700 p-2 rounded w-full outline-none focus:border-blue-500 text-sm">
                            <option value="">Loading Projects...</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-gray-400 font-bold uppercase">Task</label>
                        <select id="task-select" disabled class="bg-black/50 border border-gray-700 p-2 rounded w-full outline-none focus:border-blue-500 text-sm disabled:opacity-50">
                            <option value="">Select a Project First</option>
                        </select>
                    </div>

                    <div id="layer-controls" class="hidden flex-col gap-2 pt-3 border-t border-gray-700">
                        <label class="text-xs text-gray-400 font-bold uppercase mb-1">Raster Layers</label>
                        <label class="flex items-center gap-3 bg-black/30 p-2.5 rounded border border-gray-700/50 cursor-pointer hover:bg-black/50 transition">
                            <input type="checkbox" value="orthophoto" class="layer-toggle w-4 h-4 text-blue-600 rounded bg-gray-700 border-gray-600" checked> 
                            <span class="font-medium">Orthophoto</span>
                        </label>
                        <label class="flex items-center gap-3 bg-black/30 p-2.5 rounded border border-gray-700/50 cursor-pointer hover:bg-black/50 transition">
                            <input type="checkbox" value="dsm" class="layer-toggle w-4 h-4 text-blue-600 rounded bg-gray-700 border-gray-600"> 
                            <span class="font-medium">DSM (Surface)</span>
                        </label>
                        <label class="flex items-center gap-3 bg-black/30 p-2.5 rounded border border-gray-700/50 cursor-pointer hover:bg-black/50 transition">
                            <input type="checkbox" value="dtm" class="layer-toggle w-4 h-4 text-blue-600 rounded bg-gray-700 border-gray-600"> 
                            <span class="font-medium">DTM (Terrain)</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating Action Button (FAB) -->
        <button id="fab-btn" class="pointer-events-auto bg-blue-600 hover:bg-blue-500 w-16 h-16 rounded-full shadow-[0_0_20px_rgba(37,99,235,0.4)] flex items-center justify-center transform transition hover:scale-105 active:scale-95 text-white">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </div>

    <!-- Application Logic -->
    <script>
        // Ensure DOM is fully parsed before executing anything
        document.addEventListener('DOMContentLoaded', () => {
            
            console.log("[App] Initializing UI Bindings");

            // --- 1. UI Elements ---
            const panel = document.getElementById('layer-panel');
            const fabBtn = document.getElementById('fab-btn');
            const btnClosePanel = document.getElementById('btn-close-panel');
            const uiAuthForm = document.getElementById('auth-form');
            const uiData = document.getElementById('data-section');
            const uiError = document.getElementById('auth-error');
            const btnConnect = document.getElementById('btn-connect');
            const btnLogout = document.getElementById('btn-logout');
            const selectProject = document.getElementById('project-select');
            const selectTask = document.getElementById('task-select');
            const layerControls = document.getElementById('layer-controls');
            const layerToggles = document.querySelectorAll('.layer-toggle');

            // --- 2. State ---
            const state = {
                url: '',
                token: null,
                projects: [],
                tasks: [],
                activeProject: null,
                activeTask: null,
                activeLayers: new Set(['orthophoto'])
            };

            // --- 3. UI Interactions (Bulletproof logic) ---
            fabBtn.addEventListener('click', () => {
                panel.classList.remove('hidden');
                panel.classList.add('flex');
            });

            btnClosePanel.addEventListener('click', () => {
                panel.classList.add('hidden');
                panel.classList.remove('flex');
            });

            layerToggles.forEach(toggle => {
                toggle.addEventListener('change', (e) => {
                    if(e.target.checked) state.activeLayers.add(e.target.value);
                    else state.activeLayers.delete(e.target.value);
                    renderDeckLayers();
                });
            });

            // --- 4. Deck.GL & MapLibre Integration ---
            console.log("[App] Initializing DeckGL Context");
            let deckgl;

            try {
                // The Google Hybrid Basemap specification requested
                const GOOGLE_HYBRID_STYLE = {
                    version: 8,
                    sources: {
                        'google': {
                            type: 'raster',
                            tiles: ['https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'],
                            tileSize: 256,
                            attribution: 'Map data © Google'
                        }
                    },
                    layers: [{
                        id: 'google-hybrid',
                        type: 'raster',
                        source: 'google',
                        minzoom: 0,
                        maxzoom: 22
                    }]
                };

                // Initialize DeckGL wrapper (safest approach)
                deckgl = new deck.DeckGL({
                    container: 'map',
                    map: maplibregl, // DeckGL will auto-instantiate MapLibre basemap
                    mapStyle: GOOGLE_HYBRID_STYLE,
                    initialViewState: {
                        longitude: -98.5795,
                        latitude: 39.8283,
                        zoom: 3,
                        pitch: 0,
                        bearing: 0
                    },
                    controller: true,
                    layers: [] // Managed by renderDeckLayers()
                });
            } catch (error) {
                console.error("[CRITICAL ERROR] Map Initialization failed:", error);
                uiError.innerText = "The map engine failed to load. Please refresh the page.";
                uiError.classList.remove('hidden');
            }

            // --- 5. WebODM API Logic ---
            async function apiCall(endpoint, method = 'GET', body = null) {
                const headers = { 'Content-Type': 'application/json' };
                if (state.token) headers['Authorization'] = `JWT ${state.token}`;
                
                const config = { method, headers };
                if (body) config.body = JSON.stringify(body);

                try {
                    const res = await fetch(`${state.url}${endpoint}`, config);
                    if (!res.ok) throw new Error(`Server returned ${res.status}`);
                    return await res.json();
                } catch (err) {
                    console.error(`[API] Request failed:`, err);
                    if (err.name === 'TypeError' && err.message.includes('fetch')) {
                        throw new Error("CORS Network Error. Make sure CORS_ORIGIN_ALLOW_ALL=True is set on your WebODM instance.");
                    }
                    throw err;
                }
            }

            uiAuthForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                let rawUrl = document.getElementById('server-url').value.trim();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (rawUrl && !/^https?:\/\//i.test(rawUrl)) rawUrl = 'http://' + rawUrl;
                rawUrl = rawUrl.replace(/\/$/, '');

                btnConnect.innerText = "Connecting...";
                uiError.classList.add('hidden');

                try {
                    state.url = rawUrl;
                    const data = await apiCall('/api/token-auth/', 'POST', { username, password });
                    
                    if (data.token) {
                        state.token = data.token;
                        uiAuthForm.classList.add('hidden');
                        uiData.classList.remove('hidden');
                        uiData.classList.add('flex');
                        await loadProjects();
                    } else {
                        throw new Error("No authorization token received.");
                    }
                } catch (err) {
                    uiError.innerText = err.message;
                    uiError.classList.remove('hidden');
                } finally {
                    btnConnect.innerText = "Connect";
                }
            });

            btnLogout.addEventListener('click', () => {
                state.token = null;
                state.activeTask = null;
                uiAuthForm.classList.remove('hidden');
                uiData.classList.add('hidden');
                uiData.classList.remove('flex');
                renderDeckLayers(); // Clear map
            });

            async function loadProjects() {
                selectProject.innerHTML = '<option value="">Loading...</option>';
                try {
                    const res = await apiCall('/api/projects/');
                    state.projects = res.results || res; 
                    selectProject.innerHTML = '<option value="">-- Choose a Project --</option>';
                    state.projects.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = p.name;
                        selectProject.appendChild(opt);
                    });
                } catch(e) {
                    selectProject.innerHTML = '<option value="">Error loading projects</option>';
                    console.error(e);
                }
            }

            selectProject.addEventListener('change', async (e) => {
                const projectId = e.target.value;
                if (!projectId) {
                    selectTask.disabled = true;
                    return;
                }
                state.activeProject = projectId;
                selectTask.innerHTML = '<option value="">Loading...</option>';
                selectTask.disabled = true;
                
                try {
                    const res = await apiCall(`/api/projects/${projectId}/tasks/`);
                    state.tasks = res.results || res;
                    selectTask.innerHTML = '<option value="">-- Choose a Task --</option>';
                    state.tasks.forEach(t => {
                        if(t.status === 40 || t.status === 50) { // Completed or Partial
                            const opt = document.createElement('option');
                            opt.value = t.id;
                            opt.textContent = t.name;
                            selectTask.appendChild(opt);
                        }
                    });
                    selectTask.disabled = false;
                } catch(e) {
                    selectTask.innerHTML = '<option value="">Error loading tasks</option>';
                    console.error(e);
                }
            });

            selectTask.addEventListener('change', async (e) => {
                const taskId = e.target.value;
                if (!taskId) {
                    layerControls.classList.add('hidden');
                    state.activeTask = null;
                    renderDeckLayers();
                    return;
                }
                
                state.activeTask = state.tasks.find(t => t.id == taskId);
                layerControls.classList.remove('hidden');
                layerControls.classList.add('flex');
                
                flyToTaskExtent(state.activeTask);
                renderDeckLayers();
                
                // Auto-hide panel on mobile to let user see the map immediately
                if(window.innerWidth < 768) {
                    panel.classList.add('hidden');
                    panel.classList.remove('flex');
                }
            });

            // --- 6. Core Map Logic ---
            function flyToTaskExtent(task) {
                if (!deckgl) return;
                try {
                    // Try to find GeoJSON boundaries generated by WebODM
                    const extentData = task.orthophoto_extent || task.dsm_extent || task.dtm_extent;
                    if (extentData) {
                        const geojson = typeof extentData === 'string' ? JSON.parse(extentData) : extentData;
                        if (geojson && geojson.coordinates && geojson.coordinates[0]) {
                            
                            let minLng = 180, maxLng = -180, minLat = 90, maxLat = -90;
                            const coords = geojson.coordinates[0];
                            
                            coords.forEach(([lng, lat]) => {
                                if(lng < minLng) minLng = lng;
                                if(lng > maxLng) maxLng = lng;
                                if(lat < minLat) minLat = lat;
                                if(lat > maxLat) maxLat = lat;
                            });

                            // Calculate center point mathematically
                            const centerLng = (minLng + maxLng) / 2;
                            const centerLat = (minLat + maxLat) / 2;

                            console.log(`[Map] Flying to bounds center: ${centerLng}, ${centerLat}`);

                            // Perform animated camera flight
                            deckgl.setProps({
                                initialViewState: {
                                    longitude: centerLng,
                                    latitude: centerLat,
                                    zoom: 16, // Default drone zoom depth
                                    pitch: 0,
                                    bearing: 0,
                                    transitionDuration: 2500,
                                    transitionInterpolator: new deck.FlyToInterpolator()
                                }
                            });
                            return;
                        }
                    }
                    console.warn("[Map] No extent boundary found on task.");
                } catch (e) {
                    console.error("[Map] Failed to calculate task extent boundaries", e);
                }
            }

            function renderDeckLayers() {
                if (!deckgl) return;

                if (!state.activeTask || state.activeLayers.size === 0) {
                    deckgl.setProps({ layers: [] });
                    return;
                }

                const pid = state.activeProject;
                const tid = state.activeTask.id;
                const generatedLayers = [];
                
                // The extension used for webodm tiles (PNG is most universally supported default fallback)
                const TILE_EXT = 'png'; 

                state.activeLayers.forEach(type => {
                    const tileUrl = `${state.url}/api/projects/${pid}/tasks/${tid}/${type}/tiles/{z}/{x}/{y}.${TILE_EXT}`;
                    
                    const webodmLayer = new deck.TileLayer({
                        id: `webodm-${type}-${tid}`,
                        data: tileUrl,
                        minZoom: 0,
                        maxZoom: 22,
                        tileSize: 256,
                        
                        // Custom tile fetcher to securely inject the WebODM JWT token
                        getTileData: async (tile) => {
                            try {
                                const response = await fetch(tile.url, {
                                    headers: { 'Authorization': `JWT ${state.token}` }
                                });
                                if (!response.ok) return null; // 404 is normal for empty tiles off the map edge
                                const blob = await response.blob();
                                return await createImageBitmap(blob);
                            } catch (e) {
                                return null; 
                            }
                        },
                        
                        renderSubLayers: props => {
                            const { bbox: {west, south, east, north} } = props.tile;
                            return new deck.BitmapLayer(props, {
                                data: null,
                                image: props.data,
                                bounds: [west, south, east, north]
                            });
                        }
                    });
                    
                    generatedLayers.push(webodmLayer);
                });

                console.log(`[Map] Rendering ${generatedLayers.length} active DeckGL layers`);
                deckgl.setProps({ layers: generatedLayers });
            }

        }); // End DOMContentLoaded Sandbox
    </script>
</body>
</html>
